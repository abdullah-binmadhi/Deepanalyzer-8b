[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepanalyze"
version = "4.0.0"
description = "Deterministic Data Leak Prevention (DLP) & Compliance Air-Gap Gateway"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Abdullah Faisal khaled Bin Madhi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "orjson>=3.9.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    "ipython>=8.18.0",
    "openpyxl>=3.1.0",
    "pyperclip>=1.8.2",
    "pandas>=2.0.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.setuptools]
packages = ["deepanalyze"]

[project.scripts]
deepanalyze = "deepanalyze.server:cli_entrypoint"